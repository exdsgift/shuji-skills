<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-pie" viewBox="0 0 613 328" width="613" height="328" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Cantarell, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="pie" aria-labelledby="pie-0-title" aria-describedby="pie-0-desc"><style>.pele{--page:#ffffff;--pele-bg:#f3f3f3;--pele-fg:#141414;--pele-muted:#6b6b6b;--pele-line:#8c8c8c;--pele-surface:#fafafa;--pele-surface-alt:#efefef;--pele-border:#d2d2d2;--pele-accent:#f0531a;--pele-critical:#f0531a;--pele-radius:6px;--accent:#f0531a;--bar:#ececec;--bar-border:#cfcfcf;--on-series:#141414;--pele-series-1:#0072b2;--pele-series-2:#009e73;--pele-series-3:#d55e00;--pele-series-4:#cc79a7;--pele-series-5:#e69f00;--pele-series-6:#56b4e9;--pele-series-7:#f0e442;--pele-series-8:#8c8c8c;}.pele{background:var(--page);}.pele .pele-marker[fill="var(--_l)"]{fill:var(--accent);}.pele .pele-marker:not([fill]){stroke:var(--accent);}.pele-er .pele-marker:not([fill]){stroke:var(--_l);}.pele .pele-edge-label text{fill:var(--_m);}.pele-sequence .pele-edge-label text{fill:var(--_fg);}.pele-sequence .pele-lifeline{stroke-dasharray:5 4;}.pele-gantt rect[fill="var(--_c)"]{fill:var(--bar);stroke:var(--bar-border);}.pele-gantt .pele-label[fill="var(--_bg)"]{fill:var(--_fg);}.pele-pie .pele-slice-labels[fill]{fill:var(--on-series);}.pele-agentflow .pele-node>[fill^="var(--pele-series"]{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-agentflow .pele-node>[stroke^="var(--pele-series"]{stroke:var(--_b);}.pele-timeline .pele-section>rect,.pele-timeline .pele-period>rect{fill:var(--bar);stroke:var(--bar-border);}.pele-timeline .pele-section>text,.pele-timeline .pele-period>text{fill:var(--_fg);}.pele-timeline .pele-event>rect{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-timeline .pele-dot{fill:var(--_l);stroke:none;}.pele .key>:first-child{stroke:var(--accent);stroke-width:1.5;}.pele .ext>:first-child{stroke-dasharray:4 3;}</style><title id="pie-0-title">Last month's cloud bill by service</title><desc id="pie-0-desc">Of a 10,400 USD bill, compute took 4,200 and managed databases 2,600, together almost two thirds; storage took 1,800, data transfer 950, and the remaining 850 is monitoring 310, load balancers 280, backups 220 and DNS 40.</desc><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="306.5" y="41.6">Last month's cloud bill (USD, total 10,400)</tspan></text><g class="pele-slices" transform="translate(144,184)" stroke="var(--_bg)" stroke-width="1" stroke-linejoin="round"><path class="pele-slice" data-id="Compute" d="M0,0L0,-120A120,120 0 0 1 68.17,98.76Z" fill="var(--pele-series-1,#4c78a8)"/><path class="pele-slice" data-id="Managed databases" d="M0,0L68.17,98.76A120,120 0 0 1 -98.76,68.17Z" fill="var(--pele-series-2,#f58518)"/><path class="pele-slice" data-id="Storage" d="M0,0L-98.76,68.17A120,120 0 0 1 -106.25,-55.77Z" fill="var(--pele-series-3,#54a24b)"/><path class="pele-slice" data-id="Data transfer" d="M0,0L-106.25,-55.77A120,120 0 0 1 -58.95,-104.52Z" fill="var(--pele-series-4,#e45756)"/><path class="pele-slice" data-id="Other: monitoring, LBs, backups, DNS" d="M0,0L-58.95,-104.52A120,120 0 0 1 0,-120Z" fill="var(--pele-series-5,#72b7b2)"/></g><g class="pele-slice-labels" transform="translate(144,184)" font-size="14" text-anchor="middle" fill="var(--_bg)"><text x="85.92" y="-21.88">40%</text><text x="-16.22" y="93.43">25%</text><text x="-89.84" y="10.33">17%</text><text x="-64.59" y="-57.77">9%</text><text x="-22.86" y="-82.15">8%</text></g><g class="pele-legend" font-size="14"><g class="pele-legend-item" data-id="Compute"><rect x="296" y="126" width="12" height="12" rx="2" fill="var(--pele-series-1,#4c78a8)"/><text x="365.81" y="136.9" text-anchor="middle">Compute [4200]</text></g><g class="pele-legend-item" data-id="Managed databases"><rect x="296" y="152" width="12" height="12" rx="2" fill="var(--pele-series-2,#f58518)"/><text x="400.83" y="162.9" text-anchor="middle">Managed databases [2600]</text></g><g class="pele-legend-item" data-id="Storage"><rect x="296" y="178" width="12" height="12" rx="2" fill="var(--pele-series-3,#54a24b)"/><text x="361.92" y="188.9" text-anchor="middle">Storage [1800]</text></g><g class="pele-legend-item" data-id="Data transfer"><rect x="296" y="204" width="12" height="12" rx="2" fill="var(--pele-series-4,#e45756)"/><text x="373.97" y="214.9" text-anchor="middle">Data transfer [950]</text></g><g class="pele-legend-item" data-id="Other: monitoring, LBs, backups, DNS"><rect x="296" y="230" width="12" height="12" rx="2" fill="var(--pele-series-5,#72b7b2)"/><text x="452.17" y="240.9" text-anchor="middle">Other: monitoring, LBs, backups, DNS [850]</text></g></g></svg>