ele-slice-labels[fill]{fill:var(--on-series);}.pele-agentflow .pele-node>[fill^="var(--pele-series"]{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-agentflow .pele-node>[stroke^="var(--pele-series"]{stroke:var(--_b);}.pele-timeline .pele-section>rect,.pele-timeline .pele-period>rect{fill:var(--bar);stroke:var(--bar-border);}.pele-timeline .pele-section>text,.pele-timeline .pele-period>text{fill:var(--_fg);}.pele-timeline .pele-event>rect{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-timeline .pele-dot{fill:var(--_l);stroke:none;}.pele .key>:first-child{stroke:var(--accent);stroke-width:1.5;}.pele .ext>:first-child{stroke-dasharray:4 3;}</style><title id="flowchart-architecture-0-title">Checkout architecture</title><desc id="flowchart-architecture-0-desc">Browsers reach the API gateway through Cloudflare. The gateway routes to the cart, payment and order services. The payment service, changed in this PR, charges cards through Stripe and sends a webhook to the order service. Orders are stored in Postgres, carts in Redis.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_browsers_cloudflare_0"><path d="M142.67,168.5L183.67,168.5"/><path class="pele-marker" d="M190.67,168.5L182.67,171.86L182.67,165.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cloudflare_gateway_0"><path d="M299.58,168.5L340.58,168.5"/><path class="pele-marker" d="M347.58,168.5L339.58,171.86L339.58,165.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_gateway_cart_0"><path d="M473.41,156.5C499.14,156.5 499.14,54 524.86,54L530.86,54"/><path class="pele-marker" d="M537.86,54L529.86,57.36L529.86,50.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_gateway_payment_0"><path d="M473.41,168.5L514.41,168.5"/><path class="pele-marker" d="M521.41,168.5L513.41,171.86L513.41,165.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_gateway_order_0"><path d="M473.41,180.5C497.41,180.5 497.41,244 521.41,244L816.58,244"/><path class="pele-marker" d="M823.58,244L815.58,247.36L815.58,240.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_payment_stripe_0"><path d="M675.66,160.5C685.91,160.5 685.91,148 696.16,148L843.7,148"/><path class="pele-marker" d="M850.7,148L842.7,151.36L842.7,144.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_payment_order_0"><path d="M675.66,176.5C685.91,176.5 685.91,223.5 696.16,223.5L796.08,223.5C803.77,223.5 803.77,224 811.46,224L816.58,224" stroke-dasharray="3 4"/><path class="pele-marker" d="M823.58,224L815.58,227.36L815.58,220.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_cart_redis_0"><path d="M659.21,54L844.14,54"/><path class="pele-marker" d="M851.14,54L843.14,57.36L843.14,50.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_order_postgres_0"><path d="M955.6,236L996.6,236"/><path class="pele-marker" d="M1003.6,236L995.6,239.36L995.6,232.64Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_payment_stripe_0"><rect x="698.16" y="137.5" width="95.92" height="21" rx="3" fill="var(--_bg)"/><text x="746.12" y="152.9" text-anchor="middle">charges cards</text></g><g class="pele-edge-label" data-id="L_payment_order_0"><rect x="714.11" y="213" width="64.03" height="21" rx="3" fill="var(--_bg)"/><text x="746.12" y="228.4" text-anchor="middle">webhook</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-stadium" data-id="browsers" transform="translate(83.34,168.5)"><rect x="-59.34" y="-24" width="118.67" height="48" rx="24" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Browsers</text></g><g class="pele-node pele-shape-rect ext" data-id="cloudflare" transform="translate(245.13,168.5)"><rect x="-54.46" y="-24" width="108.91" height="48" fill="var(--_s)" stroke="va