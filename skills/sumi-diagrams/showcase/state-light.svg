<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 652 200" width="652" height="200" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Cantarell, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" aria-labelledby="state-0-title" aria-describedby="state-0-desc"><style>.pele{--page:#ffffff;--pele-bg:#f3f3f3;--pele-fg:#141414;--pele-muted:#6b6b6b;--pele-line:#8c8c8c;--pele-surface:#fafafa;--pele-surface-alt:#efefef;--pele-border:#d2d2d2;--pele-accent:#f0531a;--pele-critical:#f0531a;--pele-radius:6px;--accent:#f0531a;--bar:#ececec;--bar-border:#cfcfcf;--on-series:#141414;--pele-series-1:#0072b2;--pele-series-2:#009e73;--pele-series-3:#d55e00;--pele-series-4:#cc79a7;--pele-series-5:#e69f00;--pele-series-6:#56b4e9;--pele-series-7:#f0e442;--pele-series-8:#8c8c8c;}.pele{background:var(--page);}.pele .pele-marker[fill="var(--_l)"]{fill:var(--accent);}.pele .pele-marker:not([fill]){stroke:var(--accent);}.pele-er .pele-marker:not([fill]){stroke:var(--_l);}.pele .pele-edge-label text{fill:var(--_m);}.pele-sequence .pele-edge-label text{fill:var(--_fg);}.pele-sequence .pele-lifeline{stroke-dasharray:5 4;}.pele-gantt rect[fill="var(--_c)"]{fill:var(--bar);stroke:var(--bar-border);}.pele-gantt .pele-label[fill="var(--_bg)"]{fill:var(--_fg);}.pele-pie .pele-slice-labels[fill]{fill:var(--on-series);}.pele-agentflow .pele-node>[fill^="var(--pele-series"]{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-agentflow .pele-node>[stroke^="var(--pele-series"]{stroke:var(--_b);}.pele-timeline .pele-section>rect,.pele-timeline .pele-period>rect{fill:var(--bar);stroke:var(--bar-border);}.pele-timeline .pele-section>text,.pele-timeline .pele-period>text{fill:var(--_fg);}.pele-timeline .pele-event>rect{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-timeline .pele-dot{fill:var(--_l);stroke:none;}.pele .key>:first-child{stroke:var(--accent);stroke-width:1.5;}.pele .ext>:first-child{stroke-dasharray:4 3;}</style><title id="state-0-title">Document renderer states</title><desc id="state-0-desc">The renderer starts idle and parses when the user types; a valid source is rendered and an invalid one shows an error; it returns to idle when rendering completes or when the user edits after an error.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M38,99L75,99"/><path class="pele-marker" d="M82,99L74,102.36L74,95.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M522.11,42.75L509.11,42.75C490.66,42.75 490.66,36.5 472.21,36.5L177.44,36.5C165.11,36.5 165.11,89 152.79,89L146.79,89"/><path class="pele-marker" d="M139.79,89L147.79,85.64L147.79,92.36Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M139.79,99L270.33,99"/><path class="pele-marker" d="M277.33,99L269.33,102.36L269.33,95.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M363.57,93C381.3,93 381.3,58.75 399.02,58.75L515.11,58.75"/><path class="pele-marker" d="M522.11,58.75L514.11,62.11L514.11,55.39Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M363.57,109L496.61,109C503.54,109 503.54,145.5 510.48,145.5L515.11,145.5"/><path class="pele-marker" d="M522.11,145.5L514.11,148.86L514.11,142.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M522.11,161.5L177.44,161.5C165.11,161.5 165.11,109 152.79,109L146.79,109"/><path class="pele-marker" d="M139.79,109L147.79,105.64L147.79,112.36Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="262.37" y="26" width="116.15" height="21" rx="3" fill="var(--_bg)"/><text x="320.45" y="41.4" text-anchor="middle">render completes</text></g><g class="pele-edge-label" data-id="edge2"><rect x="160.29" y="88.5" width="72.58" height="21" rx="3" fill="var(--_bg)"/><text x="196.58" y="103.9" text-anchor="middle">user types</text></g><g class="pele-edge-label" data-id="edge3"><rect x="406.47" y="48.25" width="82.69" height="21" rx="3" fill="var(--_bg)"/><text x="447.82" y="63.65" text-anchor="middle">source valid</text></g><g class="pele-edge-label" data-id="edge4"><rect x="401.02" y="98.5" width="93.58" height="21" rx="3" fill="var(--_bg)"/><text x="447.82" y="113.9" text-anchor="middle">source invalid</text></g><g class="pele-edge-label" data-id="edge5"><rect x="286.1" y="151" width="68.69" height="21" rx="3" fill="var(--_bg)"/><text x="320.45" y="166.4" text-anchor="middle">user edits</text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(31,99)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="Idle" transform="translate(110.9,99)"><rect x="-28.9" y="-22" width="57.79" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Idle</text></g><g class="pele-node pele-state" data-id="Rendering" transform="translate(575.01,48.75)"><rect x="-52.9" y="-22" width="105.81" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Rendering</text></g><g class="pele-node pele-state" data-id="Parsing" transform="translate(320.45,99)"><rect x="-43.12" y="-22" width="86.24" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Parsing</text></g><g class="pele-node pele-state" data-id="Error" transform="translate(555.88,153.5)"><rect x="-33.78" y="-22" width="67.55" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Error</text></g></g></svg>