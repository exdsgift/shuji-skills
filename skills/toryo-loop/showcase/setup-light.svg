on-series);}.pele-agentflow .pele-node>[fill^="var(--pele-series"]{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-agentflow .pele-node>[stroke^="var(--pele-series"]{stroke:var(--_b);}.pele-timeline .pele-section>rect,.pele-timeline .pele-period>rect{fill:var(--bar);stroke:var(--bar-border);}.pele-timeline .pele-section>text,.pele-timeline .pele-period>text{fill:var(--_fg);}.pele-timeline .pele-event>rect{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-timeline .pele-dot{fill:var(--_l);stroke:none;}.pele .key>:first-child{stroke:var(--accent);stroke-width:1.5;}.pele .ext>:first-child{stroke-dasharray:4 3;}</style><title id="setup-0-title">First run of toryo-loop in a repository</title><desc id="setup-0-desc">With no setup file in the repository, the skill starts no ticket. It asks the knobs once, creates the tracker issues that are missing, writes the setup file, copies the three agent files with the chosen models, installs the guard hook if wanted, checks that gh reads the tracker issues, lands the setup through a pull request, and asks for a new session so the agent files load.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge" data-id="L_start_ask_0"><path d="M191.27,96L191.27,137"/><path class="pele-marker" d="M191.27,144L187.91,136L194.63,136Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_ask_issues_0"><path d="M191.27,264L191.27,305"/><path class="pele-marker" d="M191.27,312L187.91,304L194.63,304Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_issues_write_0"><path d="M191.27,384L191.27,425"/><path class="pele-marker" d="M191.27,432L187.91,424L194.63,424Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_write_agents_0"><path d="M191.27,528L191.27,569"/><path class="pele-marker" d="M191.27,576L187.91,568L194.63,568Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_agents_hook_0"><path d="M191.27,672L191.27,713"/><path class="pele-marker" d="M191.27,720L187.91,712L194.63,712Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_hook_guard_0"><path d="M166.55,839.38C166.55,857.36 121.58,857.36 121.58,875.33L121.58,920.83"/><path class="pele-marker" d="M121.58,927.83L118.22,919.83L124.94,919.83Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_hook_verify_0"><path d="M215.99,839.38C215.99,883.61 260.95,883.61 260.95,927.83L260.95,1040.83"/><path class="pele-marker" d="M260.95,1047.83L257.59,1039.83L264.31,1039.83Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_guard_verify_0"><path d="M121.58,999.83L121.58,1040.83"/><path class="pele-marker" d="M121.58,1047.83L118.22,1039.83L124.94,1039.83Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_verify_pr_0"><path d="M191.27,1119.83L191.27,1160.83"/><path class="pele-marker" d="M191.27,1167.83L187.91,1159.83L194.63,1159.83Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_pr_restart_0"><path d="M191.27,1239.83L191.27,1280.83"/><path class="pele-marker" d="M191.27,1287.83L187.91,1279.83L194.63,1279.83Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge" data-id="L_restart_ready_0"><path d="M191.27,1359.83L191.27,1400.83"/><path class="pele-marker" d="M191.27,1407.83L187.91,1399.83L194.63,1399.83Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="L_hook_guard_0"><rect x="106.69" y="877.33" width="29.78" height="21" rx="3" fill="var(--_bg)"/><text x="121.58" y="892.73" text-anchor="middle">yes</text></g><g class="pele-edge-label" data-id="L_hook_verify_0"><rect x="249.17" y="953.33" width="23.57" height="21" rx="3" fill="var(--_bg)"/><text x="260.95" y="968.73" text-anchor="middle">no</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-stadium" data-id="start" transform="translate(191.27,60)"><rect x="-98.26" y="-36" width="196.51" height="72" rx="36" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">No setup file in the</tspan><tspan x="0" y="17.6">repository</tspan></text></g><g class="pele-node pele-shape-rect" data-id="ask" transform="translate(191.27,204)"><rect x="-116.73" y="-60" width="233.46" height="120" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-30.4">Ask the knobs once: queue,</tspan><tspan x="0" y="-6.4">deferred and nits issues,</tspan><tspan x="0" y="17.6">land command, checks,</tspan><tspan x="0" y="41.6">models, mirror</tspan></text></g><g class="pele-node pele-shape-rect" data-id="issues" transform="translate(191.27,348)"><rect x="-111.38" y="-36" width="222.75" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Create the missing queue,</tspan><tspan x="0" y="17.6">deferred and nits issues</tspan></text></g><g class="pele-node pele-shape-rect" data-id="write" transform="translate(191.27,480)"><rect x="-112.26" y="-48" width="224.53" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">Write</tspan><tspan x="0" y="5.6">docs/agents/toryo-loop.md</tspan><tspan x="0" y="29.6">from the template</tspan></text></g><g class="pele-node pele-shape-rect" data-id="agents" transform="translate(191.27,624)"><rect x="-114.03" y="-48" width="228.06" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">Copy executor,</tspan><tspan x="0" y="5.6">executor-light and reviewer</tspan><tspan x="0" y="29.6">with the chosen models</tspan></text></g><g class="pele-node pele-shape-diam" data-id="hook" transform="translate(191.27,787.42)"><polygon points="0,-67.41 107.86,0 0,67.41 -107.86,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Guard hook wanted?</text></g><g class="pele-node pele-shape-rect" data-id="guard" transform="translate(121.58,963.83)"><rect x="-97.58" y="-36" width="195.17" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Install it: no commit on</tspan><tspan x="0" y="17.6">main, worktree cap</tspan></text></g><g class="pele-node pele-shape-rect" data-id="verify" transform="translate(191.27,1083.83)"><rect x="-110.05" y="-36" width="220.1" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Check: gh reads the three</tspan><tspan x="0" y="17.6">tracker issues</tspan></text></g><g class="pele-node pele-shape-rect" data-id="pr" transform="translate(191.27,1203.83)"><rect x="-106.95" y="-36" width="213.9" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Land the setup through a</tspan><tspan x="0" y="17.6">pull request</tspan></text></g><g class="pele-node pele-shape-rect" data-id="restart" transform="translate(191.27,1323.83)"><rect x="-104.26" y="-36" width="208.51" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">New session: agent files</tspan><tspan x="0" y="17.6">load at start</tspan></text></g><g class="pele-node pele-shape-stadium key" data-id="ready" transform="translate(191.27,1443.83)"><rect x="-125.82" y="-36" width="251.65" height="72" rx="36" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">Ready: the master reads</tspan><tspan x="0" y="17.6">the setup file at every start</tspan></text></g></g></svg>