<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-gantt" viewBox="0 0 800 349" width="800" height="349" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Cantarell, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="gantt" aria-labelledby="pipeline-0-title" aria-describedby="pipeline-0-desc"><style>.pele{--page:#ffffff;--pele-bg:#f3f3f3;--pele-fg:#141414;--pele-muted:#6b6b6b;--pele-line:#8c8c8c;--pele-surface:#fafafa;--pele-surface-alt:#efefef;--pele-border:#d2d2d2;--pele-accent:#f0531a;--pele-critical:#f0531a;--pele-radius:6px;--accent:#f0531a;--bar:#ececec;--bar-border:#cfcfcf;--on-series:#141414;--pele-series-1:#0072b2;--pele-series-2:#009e73;--pele-series-3:#d55e00;--pele-series-4:#cc79a7;--pele-series-5:#e69f00;--pele-series-6:#56b4e9;--pele-series-7:#f0e442;--pele-series-8:#8c8c8c;}.pele{background:var(--page);}.pele .pele-marker[fill="var(--_l)"]{fill:var(--accent);}.pele .pele-marker:not([fill]){stroke:var(--accent);}.pele-er .pele-marker:not([fill]){stroke:var(--_l);}.pele .pele-edge-label text{fill:var(--_m);}.pele-sequence .pele-edge-label text{fill:var(--_fg);}.pele-sequence .pele-lifeline{stroke-dasharray:5 4;}.pele-gantt rect[fill="var(--_c)"]{fill:var(--bar);stroke:var(--bar-border);}.pele-gantt .pele-label[fill="var(--_bg)"]{fill:var(--_fg);}.pele-pie .pele-slice-labels[fill]{fill:var(--on-series);}.pele-agentflow .pele-node>[fill^="var(--pele-series"]{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-agentflow .pele-node>[stroke^="var(--pele-series"]{stroke:var(--_b);}.pele-timeline .pele-section>rect,.pele-timeline .pele-period>rect{fill:var(--bar);stroke:var(--bar-border);}.pele-timeline .pele-section>text,.pele-timeline .pele-period>text{fill:var(--_fg);}.pele-timeline .pele-event>rect{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-timeline .pele-dot{fill:var(--_l);stroke:none;}.pele .key>:first-child{stroke:var(--accent);stroke-width:1.5;}.pele .ext>:first-child{stroke-dasharray:4 3;}</style><title id="pipeline-0-title">Two tickets in flight</title><desc id="pipeline-0-desc">Ticket N+1 starts building when N's draft PR goes to review, opens its own PR when N goes into landing, and merges main once N lands; ticket N+2 starts only after N has landed, so never more than two are in flight. Durations are illustrative.</desc><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="400" y="41.6">Two tickets in flight, never three</tspan></text><g class="pele-sections"><rect class="pele-section pele-section-0" x="0" y="64" width="800" height="120" fill="var(--_s)"/><rect class="pele-section pele-section-1" x="0" y="184" width="800" height="90" fill="none"/><rect class="pele-section pele-section-2" x="0" y="274" width="800" height="30" fill="var(--_s)"/></g><g class="pele-grid" fill="none"><path d="M110.49,64V304M195.21,64V304M279.93,64V304M364.65,64V304M449.37,64V304M534.08,64V304M618.8,64V304M703.52,64V304" stroke="var(--_b)" stroke-dasharray="1 3"/><path d="M110.49,304H760" stroke="var(--_b)"/></g><g class="pele-tasks" font-size="13"><g class="pele-task" data-id="n1"><rect x="110.49" y="67" width="169.44" height="24" fill="var(--_c)" stroke="var(--_c)" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_bg)" x="195.21" y="83.55" text-anchor="middle">Build