x="63.25" y="233.55" text-anchor="middle">Ticket N+1</text><text class="pele-section-label" data-id="Ticket N+2" x="63.25" y="293.55" text-anchor="middle">Ticket N+2</text></g><g class="pele-axis" font-size="12" fill="var(--_m)"><text x="110.49" y="320.7" text-anchor="middle">09:00</text><text x="195.21" y="320.7" text-anchor="middle">09:30</text><text x="279.93" y="320.7" text-anchor="middle">10:00</text><text x="364.65" y="320.7" text-anchor="middle">10:30</text><text x="449.37" y="320.7" text-anchor="middle">11:00</text><text x="534.08" y="320.7" text-anchor="middle">11:30</text><text x="618.8" y="320.7" text-anchor="middle">12:00</text><text x="703.52" y="320.7" text-anchor="middle">12:30</text></g></svg>