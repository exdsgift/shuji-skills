<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 1121 342" width="1121" height="342" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Cantarell, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" aria-labelledby="modes-0-title" aria-describedby="modes-0-desc"><style>.pele{--page:#ffffff;--pele-bg:#f3f3f3;--pele-fg:#141414;--pele-muted:#6b6b6b;--pele-line:#8c8c8c;--pele-surface:#fafafa;--pele-surface-alt:#efefef;--pele-border:#d2d2d2;--pele-accent:#f0531a;--pele-critical:#f0531a;--pele-radius:6px;--accent:#f0531a;--bar:#ececec;--bar-border:#cfcfcf;--on-series:#141414;--pele-series-1:#0072b2;--pele-series-2:#009e73;--pele-series-3:#d55e00;--pele-series-4:#cc79a7;--pele-series-5:#e69f00;--pele-series-6:#56b4e9;--pele-series-7:#f0e442;--pele-series-8:#8c8c8c;}.pele{background:var(--page);}.pele .pele-marker[fill="var(--_l)"]{fill:var(--accent);}.pele .pele-marker:not([fill]){stroke:var(--accent);}.pele-er .pele-marker:not([fill]){stroke:var(--_l);}.pele .pele-edge-label text{fill:var(--_m);}.pele-sequence .pele-edge-label text{fill:var(--_fg);}.pele-sequence .pele-lifeline{stroke-dasharray:5 4;}.pele-gantt rect[fill="var(--_c)"]{fill:var(--bar);stroke:var(--bar-border);}.pele-gantt .pele-label[fill="var(--_bg)"]{fill:var(--_fg);}.pele-pie .pele-slice-labels[fill]{fill:var(--on-series);}.pele-agentflow .pele-node>[fill^="var(--pele-series"]{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-agentflow .pele-node>[stroke^="var(--pele-series"]{stroke:var(--_b);}.pele-timeline .pele-section>rect,.pele-timeline .pele-period>rect{fill:var(--bar);stroke:var(--bar-border);}.pele-timeline .pele-section>text,.pele-timeline .pele-period>text{fill:var(--_fg);}.pele-timeline .pele-event>rect{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-timeline .pele-dot{fill:var(--_l);stroke:none;}.pele .key>:first-child{stroke:var(--accent);stroke-width:1.5;}.pele .ext>:first-child{stroke-dasharray:4 3;}</style><title id="modes-0-title">The three autonomy modes</title><desc id="modes-0-desc">The operator starts the master in one of three modes. Autonomous keeps taking queue rows until the queue is empty or every row waits on a decision. Finish and stop lands what is in flight and takes nothing new. One ticket lands one and reports. Any mode stops on an unexplained red check or a safety rule, and waits for the operator's go.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M38,243.75C47.25,243.75 47.25,173.75 56.5,173.75L155.49,173.75"/><path class="pele-marker" d="M162.49,173.75L154.49,177.11L154.49,170.39Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M38,243.75C47.25,243.75 47.25,295.5 56.5,295.5L164.38,295.5"/><path class="pele-marker" d="M171.38,295.5L163.38,298.86L163.38,292.14Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge2"><path d="M284.31,165.75L293.94,165.75C299.05,165.75 301.2,46 306.31,46L549.75,46"/><path class="pele-marker" d="M556.75,46L548.75,49.36L548.75,42.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge3"><path d="M284.31,165.75L297.31,165.75C326.36,165.75 326.36,119 355.42,119L729.26,119C818.07,119 818.07,164.25 906.87,164.25L912.87,164.25"/><path class="pele-marker" d="M919.87,164.25L911.87,167.61L911.87,160.89Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge4"><path d="M697.25,46L894.37,46C900.88,46 901.73,164.25 908.25,164.25L912.87,164.25"/><path class="pele-marker" d="M919.87,164.25L911.87,167.61L911.87,160.89Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge5"><path d="M275.42,295.5L729.26,295.5C818.07,295.5 818.07,184.25 906.87,184.25L912.87,184.25"/><path class="pele-marker" d="M919.87,184.25L911.87,187.61L911.87,180.89Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge6"><path d="M284.31,165.75L502.73,165.75C508.36,165.75 508.36,184 513.98,184L517.73,184"/><path class="pele-marker" d="M524.73,184L516.73,187.36L516.73,180.64Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge7"><path d="M524.73,200L515.11,200C508.92,200 508.92,206.75 502.73,206.75L306.31,206.75C300.69,206.75 300.69,181.75 295.06,181.75L291.31,181.75"/><path class="pele-marker" d="M284.31,181.75L292.31,178.39L292.31,185.11Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge8"><path d="M919.87,174.25L906.87,174.25C818.07,174.25 818.07,254.5 729.26,254.5L355.42,254.5C326.36,254.5 326.36,181.75 297.31,181.75L291.31,181.75"/><path class="pele-marker" d="M284.31,181.75L292.31,178.39L292.31,185.11Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge0"><rect x="58.5" y="163.25" width="76.49" height="21" rx="3" fill="var(--_bg)"/><text x="96.74" y="178.65" text-anchor="middle">keep going</text></g><g class="pele-edge-label" data-id="edge1"><rect x="62.78" y="285" width="67.92" height="21" rx="3" fill="var(--_bg)"/><text x="96.74" y="300.4" text-anchor="middle">one ticket</text></g><g class="pele-edge-label" data-id="edge2"><rect x="355.39" y="35.5" width="98.27" height="21" rx="3" fill="var(--_bg)"/><text x="404.52" y="50.9" text-anchor="middle">finish and stop</text></g><g class="pele-edge-label" data-id="edge3"><rect x="548.69" y="98" width="156.61" height="42" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="627" y="113.4">queue empty or all rows</tspan><tspan x="627" y="134.4">blocked</tspan></text></g><g class="pele-edge-label" data-id="edge4"><rect x="749.76" y="35.5" width="142.61" height="21" rx="3" fill="var(--_bg)"/><text x="821.07" y="50.9" text-anchor="middle">in-flight tickets landed</text></g><g class="pele-edge-label" data-id="edge5"><rect x="583.7" y="285" width="86.6" height="21" rx="3" fill="var(--_bg)"/><text x="627" y="300.4" text-anchor="middle">ticket landed</text></g><g class="pele-edge-label" data-id="edge6"><rect x="308.31" y="155.25" width="192.42" height="21" rx="3" fill="var(--_bg)"/><text x="404.52" y="170.65" text-anchor="middle">unexplained red or safety rule</text></g><g class="pele-edge-label" data-id="edge7"><rect x="359.89" y="196.25" width="89.27" height="21" rx="3" fill="var(--_bg)"/><text x="404.52" y="211.65" text-anchor="middle">operator's go</text></g><g class="pele-edge-label" data-id="edge8"><rect x="582.36" y="244" width="89.27" height="21" rx="3" fill="var(--_bg)"/><text x="627" y="259.4" text-anchor="middle">operator's go</text></g></g><g class="pele-nodes"><g class="pele-node pele-state" data-id="Auto" transform="translate(223.4,173.75)"><rect x="-60.91" y="-22" width="121.82" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Autonomous</text></g><g class="pele-node pele-state" data-id="Finish" transform="translate(627,46)"><rect x="-70.25" y="-22" width="140.5" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Finish and stop</text></g><g class="pele-node pele-state" data-id="One" transform="translate(223.4,295.5)"><rect x="-52.02" y="-22" width="104.03" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">One ticket</text></g><g class="pele-node pele-state" data-id="Stopped" transform="translate(1008.36,174.25)"><rect x="-88.49" y="-22" width="176.98" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Stopped, report sent</text></g><g class="pele-node pele-state" data-id="Blocked" transform="translate(627,192)"><rect x="-102.26" y="-22" width="204.53" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Blocked, operator asked</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(31,243.75)"><circle r="7" fill="var(--_l)"/></g></g></svg>