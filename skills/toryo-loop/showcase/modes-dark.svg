M750.68,200.5L750.68,350.75C750.68,359.06 581.37,361.19 581.37,369.5L581.37,375.5"/><path class="pele-marker" d="M581.37,382.5L578.01,374.5L584.73,374.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge10"><path d="M583.12,313.5L583.12,357C583.12,363.94 565.37,363.94 565.37,370.88L565.37,375.5"/><path class="pele-marker" d="M565.37,382.5L562.01,374.5L568.73,374.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge11"><path d="M563.63,426.5L563.63,436.13C563.63,442.31 662.08,442.31 662.08,448.5L662.08,494.5C662.08,519.3 615.66,534.5 539.92,534.5C464.18,534.5 417.76,540.49 417.76,550.25L417.76,555.5"/><path class="pele-marker" d="M417.76,562.5L414.4,554.5L421.12,554.5Z" fill="var(--_l)" stroke="none"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge0"><rect x="280.57" y="108" width="50.03" height="21" rx="3" fill="var(--_bg)"/><text x="305.59" y="123.4" text-anchor="middle">default</text></g><g class="pele-edge-label" data-id="edge1"><rect x="829.54" y="281" width="76.49" height="21" rx="3" fill="var(--_bg)"/><text x="867.78" y="296.4" text-anchor="middle">keep going</text></g><g class="pele-edge-label" data-id="edge2"><rect x="704.73" y="108" width="67.92" height="21" rx="3" fill="var(--_bg)"/><text x="738.69" y="123.4" text-anchor="middle">one ticket</text></g><g class="pele-edge-label" data-id="edge3"><rect x="26" y="394" width="98.27" height="21" rx="3" fill="var(--_bg)"/><text x="75.14" y="409.4" text-anchor="middle">finish and stop</text></g><g class="pele-edge-label" data-id="edge4"><rect x="193.38" y="394" width="192.42" height="21" rx="3" fill="var(--_bg)"/><text x="289.59" y="409.4" text-anchor="middle">unexplained red or safety rule</text></g><g class="pele-edge-label" data-id="edge5"><rect x="316.72" y="221" width="192.42" height="21" rx="3" fill="var(--_bg)"/><text x="412.93" y="236.4" text-anchor="middle">unexplained red or safety rule</text></g><g class="pele-edge-label" data-id="edge6"><rect x="529.14" y="221" width="192.42" height="21" rx="3" fill="var(--_bg)"/><text x="625.35" y="236.4" text-anchor="middle">unexplained red or safety rule</text></g><g class="pele-edge-label" data-id="edge7"><rect x="440.84" y="450.5" width="156.61" height="42" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="519.14" y="465.9">queue empty or all rows</tspan><tspan x="519.14" y="486.9">blocked</tspan></text></g><g class="pele-edge-label" data-id="edge8"><rect x="234.28" y="281" width="142.61" height="21" rx="3" fill="var(--_bg)"/><text x="305.59" y="296.4" text-anchor="middle">in-flight tickets landed</text></g><g class="pele-edge-label" data-id="edge9"><rect x="707.38" y="281" width="86.6" height="21" rx="3" fill="var(--_bg)"/><text x="750.68" y="296.4" text-anchor="middle">ticket landed</text></g><g class="pele-edge-label" data-id="edge10"><rect x="553.05" y="334" width="60.14" height="21" rx="3" fill="var(--_bg)"/><text x="583.12" y="349.4" text-anchor="middle">reported</text></g><g class="pele-edge-label" data-id="edge11"><rect x="617.44" y="461" width="89.27" height="21" rx="3" fill="var(--_bg)"/><text x="662.08" y="476.4" text-anchor="middle">operator's go</text></g></g><g class="pele-nodes"><g class="pele-node pele-state" data-id="Auto" transform="translate(399.98,584.5)"><rect x="-60.91" y="-22" width="121.82" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Autonomous</text></g><g class="pele-node pele-state" data-id="Finish" transform="translate(305.59,178.5)"><rect x="-70.25" y="-22" width="140.5" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Finish and stop</text></g><g class="pele-node pele-state" data-id="One" transform="translate(738.69,178.5)"><rect x="-52.02" y="-22" width="104.03" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">One ticket</text></g><g class="pele-node pele-state" data-id="Stopped" transform="translate(527.14,404.5)"><rect x="-88.49" y="-22" width="176.98" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Stopped, report sent</text></g><g class="pele-node pele-state" data-id="Blocked" transform="translate(575.12,291.5)"><rect x="-102.26" y="-22" width="204.53" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Blocked, operator asked</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(797.45,31)"><circle r="7" fill="var(--_l)"/></g></g></svg>