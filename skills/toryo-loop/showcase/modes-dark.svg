<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 933 631" width="933" height="631" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Cantarell, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state" aria-labelledby="modes-0-title" aria-describedby="modes-0-desc"><style>.pele{--page:#ffffff;--pele-bg:#f3f3f3;--pele-fg:#141414;--pele-muted:#6b6b6b;--pele-line:#8c8c8c;--pele-surface:#fafafa;--pele-surface-alt:#efefef;--pele-border:#d2d2d2;--pele-accent:#f0531a;--pele-critical:#f0531a;--pele-radius:6px;--accent:#f0531a;--bar:#ececec;--bar-border:#cfcfcf;--on-series:#141414;--pele-series-1:#0072b2;--pele-series-2:#009e73;--pele-series-3:#d55e00;--pele-series-4:#cc79a7;--pele-series-5:#e69f00;--pele-series-6:#56b4e9;--pele-series-7:#f0e442;--pele-series-8:#8c8c8c;}.pele{--page:#151515;--pele-bg:#121212;--pele-fg:#ffffff;--pele-muted:#8b8b8b;--pele-line:#707070;--pele-surface:#171717;--pele-surface-alt:#1e1e1e;--pele-border:#333333;--pele-accent:#ff5e21;--pele-critical:#ff5e21;--accent:#ff5e21;--bar:#262626;--bar-border:#3a3a3a;--on-series:#141414;--pele-series-8:#8b8b8b;}.pele{background:var(--page);}.pele .pele-marker[fill="var(--_l)"]{fill:var(--accent);}.pele .pele-marker:not([fill]){stroke:var(--accent);}.pele-er .pele-marker:not([fill]){stroke:var(--_l);}.pele .pele-edge-label text{fill:var(--_m);}.pele-sequence .pele-edge-label text{fill:var(--_fg);}.pele-sequence .pele-lifeline{stroke-dasharray:5 4;}.pele-gantt rect[fill="var(--_c)"]{fill:var(--bar);stroke:var(--bar-border);}.pele-gantt .pele-label[fill="var(--_bg)"]{fill:var(--_fg);}.pele-pie .pele-slice-labels[fill]{fill:var(--on-series);}.pele-agentflow .pele-node>[fill^="var(--pele-series"]{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-agentflow .pele-node>[stroke^="var(--pele-series"]{stroke:var(--_b);}.pele-timeline .pele-section>rect,.pele-timeline .pele-period>rect{fill:var(--bar);stroke:var(--bar-border);}.pele-timeline .pele-section>text,.pele-timeline .pele-period>text{fill:var(--_fg);}.pele-timeline .pele-event>rect{fill:var(--_s);fill-opacity:1;stroke:var(--_b);}.pele-timeline .pele-dot{fill:var(--_l);stroke:none;}.pele .key>:first-child{stroke:var(--accent);stroke-width:1.5;}.pele .ext>:first-child{stroke-dasharray:4 3;}</style><title id="modes-0-title">The three autonomy modes</title><desc id="modes-0-desc">The operator starts the master in one of three modes, finish and stop when they name none. Autonomous keeps taking queue rows until the queue is empty or every row waits on a decision. Finish and stop lands what is in flight and takes nothing new. One ticket lands one and reports. Any mode stops on an unexplained red check or a safety rule and reports; the operator's go starts it again.</desc><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M797.45,38C797.45,55.36 704,66 551.52,66C399.04,66 305.59,81.2 305.59,106L305.59,149.5"/><path class="pele-marker" d="M305.59,156.5L302.23,148.5L308.95,148.5Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M797.45,38C797.45,97.25 867.78,97.25 867.78,156.5L867.78,483C867.78,516.25 433.76,516.25 433.76,549.5L433.76,555.5"/><path class="pele-marker" d="M433.76,562.5L430.4,554.5L437.12,554.5Z" fill="var(--_l)" stroke="none"/